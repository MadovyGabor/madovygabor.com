<!DOCTYPE html>
<html class="dark" lang="sk">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Ďakujem za Vašu dôveru! | MG Captures</title>

    <link rel="stylesheet" href="../styles.css">
    <meta name="theme-color" content="#121414">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="../pictures/favicon.png">
</head>

<body>
    <main class="thank-you-section">
        <div class="thank-you-card">
            <div class="thank-you-icon">
                <span class="material-symbols-outlined" style="font-size: 64px;">check_circle</span>
            </div>

            <h1>Ďakujem za Vašu dôveru!</h1>
            <p>Čoskoro Vás budem kontaktovať, aby sme prediskutovali Vaše predstavy a podrobnosti.</p>

            <button class="thank-you-btn" onclick="window.location.href='kontakt'">SPÄŤ NA KONTAKT</button>

            <div class="thank-you-redirect" id="countdown">
                Presmerovanie o 6 sekúnd...
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 6;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = `Presmerovanie o ${timeLeft} sekúnd...`;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.href = 'kontakt';
            }
        }, 1000);
    </script>
</body>

</html>
