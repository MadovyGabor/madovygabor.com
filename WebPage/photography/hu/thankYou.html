<body>
    <main class="thank-you-section">
        <div class="thank-you-card">
            <div class="thank-you-icon">
                <span class="material-symbols-outlined" style="font-size: 64px;">check_circle</span>
            </div>

            <h1>Köszönöm a bizalmad!</h1>
            <p>Hamarosan felveszem veled a kapcsolatot, hogy megbeszéljük az elképzeléseidet és a részleteket.</p>

            <button class="thank-you-btn" onclick="window.location.href='/hu/kontakt'">VISSZA A KAPCSOLAT OLDALRA</button>

            <div class="thank-you-redirect" id="countdown">
                Visszairányítás 6 másodperc múlva...
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 6;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = `Visszairányítás ${timeLeft} másodperc múlva...`;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.href = '/hu/kontakt';
            }
        }, 1000);
    </script>
