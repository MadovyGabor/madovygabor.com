# -------------------------------------------------------------
# Main Domain (Photography portfolio & default landing page)
# -------------------------------------------------------------
server {
    listen 80;
    server_name madovygabor.com www.madovygabor.com localhost;

    root /usr/share/nginx/html/photography;

    # 1. Cloudflare Pages redirect: bare domain redirects to default language (/hu/)
    location = / {
        return 302 /hu/;
    }

    # 2. Clean URLs & Routing for all requests
    location / {
        index index.html;
        # Try direct file, directory index, extensionless .html, or fallback to subfolder index
        try_files $uri $uri/ $uri.html =404;
    }

    # 3. Static assets cache & direct serving
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|json|xml|txt)$ {
        try_files $uri =404;
        access_log off;
    }
}

