name: Gallery manifest

# Reports problems in subdomains/photography/galleryData.json. It does not block
# anything by itself; no branch protection is configured by this workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/manifest-validator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/manifest-validator/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate
