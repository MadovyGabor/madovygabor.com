<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="robots" content="noindex, nofollow">
<title>MG Captures · Instagram sztori · Új weboldal (1080×1920)</title>
<!--
  MG Captures Instagram sztori, 1080×1920 px, recept: A · Este.
  Forrás: mg-captures-brand.html (#brand-tokens, #brand-rules, #sablonok, #ellenorzes).
  Mentés képként: nyisd meg böngészőben 100%-os nagyítással, majd képernyőkép / DevTools "Capture node screenshot" a .story elemre.
  Függőségek (relatív): fonts/*.woff2, pictures/mg-captures-logo.svg, pictures/portfolio/...
-->
<style>
  /* Betűk: a weboldal saját, self-hosted woff2 fájljai */
  @font-face { font-family:'Instrument Serif'; font-style:italic; font-weight:400; font-display:block;
    src:url('fonts/instrument-serif-v5-latin-ext-italic.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Instrument Serif'; font-style:italic; font-weight:400; font-display:block;
    src:url('fonts/instrument-serif-v5-latin-italic.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/inter-v20-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:block;
    src:url('fonts/inter-v20-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:100 800; font-display:block;
    src:url('fonts/jetbrains-mono-v24-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:100 800; font-display:block;
    src:url('fonts/jetbrains-mono-v24-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  :root {
    --surface:#121414; --ink:#ffffff; --ink-soft:#bfc7d2; --ink-muted:#a3a3a3;
    --border:#404040; --hairline:rgba(255,255,255,0.08);
    --cta-white:#ffffff; --on-cta-white:#0a0a0a;
    --font-serif:'Instrument Serif', Georgia, serif;
    --font-sans:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing:border-box; border-radius:0; margin:0; }
  html, body { background:var(--surface); }
  body { -webkit-font-smoothing:antialiased; }

  /* 1080×1920; felül és alul 250px üres az app gombjai miatt; oldalmargó 48px */
  .story { position:relative; width:1080px; height:1920px; padding:250px 48px; background:var(--surface);
           color:var(--ink-soft); display:flex; flex-direction:column; overflow:hidden; }

  .label { font:700 24px/1 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); }

  .photo { margin-top:24px; width:984px; height:612px; border:1px solid var(--border); overflow:hidden; }
  .photo img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 30%; }

  h1 { margin-top:36px; font:italic 400 88px/1.2 var(--font-serif); color:var(--ink); letter-spacing:0; }

  .langs { margin-top:24px; border-top:1px solid var(--hairline); }
  .row { display:grid; grid-template-columns:72px 1fr; align-items:start; padding:16px 0; border-bottom:1px solid var(--hairline); }
  .row .label { font-size:22px; line-height:51px; }
  .row p { font:400 32px/1.6 var(--font-sans); color:var(--ink-soft); }

  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
  .cta { display:inline-flex; align-items:center; padding:16px 40px; background:var(--cta-white); color:var(--on-cta-white);
         font:700 24px/1 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; text-decoration:none; }
  .logo { display:block; width:220px; height:auto; }
</style>
</head>
<body>
<div class="story" id="story">

  <span class="label">Új weboldal</span>

  <div class="photo">
    <img src="pictures/portfolio/Portr%C3%A9k/Portr%C3%A9im/Picture%203.webp"
         alt="Szabadtéri portré búzamezőn, naplementekor, MG Captures">
  </div>

  <h1>Megnyílt az új weboldal.</h1>

  <div class="langs">
    <div class="row"><span class="label">HU</span><p>Foglalj fotózást: tabló, ballagás, portré, rendezvény és ingatlan.</p></div>
    <div class="row"><span class="label">SK</span><p>Rezervuj si fotenie: tablo, rozlúčka, portrét, podujatia a nehnuteľnosti.</p></div>
    <div class="row"><span class="label">EN</span><p>Book a shoot: class photos, graduation, portraits, events and property.</p></div>
  </div>

  <div class="foot">
    <a class="cta" href="https://madovygabor.com">madovygabor.com</a>
    <img class="logo" src="pictures/mg-captures-logo.svg" alt="MG Captures logó">
  </div>

</div>
</body>
</html>
